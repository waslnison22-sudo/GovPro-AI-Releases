name: GovPro AI Beta Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Beta version, например 0.1.0-beta.1"
        required: true
        type: string
        default: "0.1.0-beta.1"
      source_ref:
        description: "Engineering repository ref"
        required: true
        type: string
        default: "main"

permissions:
  contents: read

concurrency:
  group: govpro-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Beta preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v7

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          python - <<'PY'
          import os
          import re

          version = os.environ.get("INPUT_VERSION", "").strip()
          source_ref = os.environ.get("INPUT_SOURCE_REF", "").strip()

          if not re.fullmatch(r"\d+\.\d+\.\d+-[0-9A-Za-z.-]+", version):
              raise SystemExit("Beta version must be prerelease SemVer, for example 0.1.0-beta.1")
          if not source_ref:
              raise SystemExit("source_ref is required")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"source_ref={source_ref}\n")
          PY

      - name: Validate source credential
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SOURCE_REPO_TOKEN" ]; then
            echo "::error::SOURCE_REPO_TOKEN is not configured."
            exit 1
          fi

      - name: Checkout engineering source
        uses: actions/checkout@v7
        with:
          repository: waslnison22-sudo/Hellsaiz-Gov-AI
          ref: ${{ steps.meta.outputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source

      - name: Record source commit
        id: source
        working-directory: source
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          printf '%s\n' "$sha" > ../SOURCE_COMMIT.txt
          echo "source_commit=$sha" >> "$GITHUB_OUTPUT"

      - name: Validate release notes
        shell: bash
        env:
          GOVPRO_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          test -f "release-notes/v${GOVPRO_VERSION}.md"
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("release-notes") / f"v{os.environ['GOVPRO_VERSION']}.md"
          text = path.read_text(encoding="utf-8")
          for heading in ("## Новое", "## Улучшено", "## Исправлено", "## Безопасность", "## Установка"):
              if heading not in text:
                  raise SystemExit(f"Missing heading: {heading}")
          PY

  publish:
    name: Publish Beta Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v7

      - name: Download platform artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: govpro-ai-beta-*
          path: dist
          merge-multiple: true

      - name: Prepare release assets
        shell: bash
        env:
          GOVPRO_VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_REF: ${{ needs.preflight.outputs.source_ref }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        run: |
          mkdir -p release-assets
          find dist -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} release-assets/ \;

          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"

          sha256sum release-assets/* > SHA256SUMS.txt

          printf '%s\n' "$SOURCE_COMMIT" > SOURCE_COMMIT.txt

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source_commit = os.environ["SOURCE_COMMIT"].strip()
          source_ref = os.environ["SOURCE_REF"].strip()
          version = os.environ["GOVPRO_VERSION"].strip()

          artifacts = []
          hashes = {}

          for line in Path("SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, filename = line.split("  ", 1)
              hashes[Path(filename).name] = digest

          for path in sorted(Path("release-assets").iterdir()):
              artifacts.append({
                  "file": path.name,
                  "bytes": path.stat().st_size,
                  "sha256": hashes[path.name],
              })

          metadata = {
              "product": "GovPro AI",
              "version": version,
              "channel": "beta",
              "source_ref": source_ref,
              "source_commit": source_commit,
              "release_url": "",
              "artifacts": artifacts,
              "signature_status": "not_configured",
              "signatures": [],
          }

          Path("RELEASE_METADATA.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVPRO_VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          gh release create "v$GOVPRO_VERSION"             release-assets/*             SHA256SUMS.txt             --draft             --prerelease             --title "GovPro AI v$GOVPRO_VERSION"             --notes-file "release-notes/v$GOVPRO_VERSION.md"

      - name: Upload release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVPRO_VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: gh release upload "v$GOVPRO_VERSION" RELEASE_METADATA.json --clobber

      - name: Verify draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVPRO_VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          gh release view "v$GOVPRO_VERSION" --json name,tagName,isDraft,isPrerelease,assets > release.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("release.json").read_text(encoding="utf-8"))
          if not data["isDraft"]:
              raise SystemExit("Release must remain draft until final verification.")

          names = {item["name"] for item in data["assets"]}
          required = {"SHA256SUMS.txt", "RELEASE_METADATA.json"}
          installers = {name for name in names if Path(name).suffix.lower() in {".exe", ".msi", ".dmg", ".appimage", ".deb"}}

          if not required.issubset(names):
              raise SystemExit("Release is missing required integrity metadata.")
          if not installers:
              raise SystemExit("Release has no installer assets.")
          PY

      - name: Publish verified Beta Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVPRO_VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: gh release edit "v$GOVPRO_VERSION" --draft=false

      - name: Update Beta channel index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVPRO_VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_REF: ${{ needs.preflight.outputs.source_ref }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        shell: bash
        run: |
          export RELEASE_URL="$(gh release view "v$GOVPRO_VERSION" --json url -q .url)"
          gh release view "v$GOVPRO_VERSION" --json assets > published-release.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          release = json.loads(Path("published-release.json").read_text(encoding="utf-8"))
          hashes = {}

          for line in Path("SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, filename = line.split("  ", 1)
              hashes[Path(filename).name] = digest

          artifacts = []
          for asset in release["assets"]:
              name = asset["name"]
              suffix = Path(name).suffix.lower()
              if suffix not in {".exe", ".msi", ".dmg", ".appimage", ".deb"}:
                  continue
              artifacts.append({
                  "file": name,
                  "bytes": asset["size"],
                  "sha256": hashes[name],
                  "download_url": asset["browser_download_url"],
              })

          data = {
              "product": "GovPro AI",
              "channel": "beta",
              "status": "published",
              "latest": {
                  "version": os.environ["GOVPRO_VERSION"],
                  "source_ref": os.environ["SOURCE_REF"],
                  "source_commit": os.environ["SOURCE_COMMIT"],
                  "release_url": os.environ["RELEASE_URL"],
                  "published_at": datetime.now(timezone.utc).isoformat(),
                  "signature_status": "not_configured",
                  "artifacts": artifacts,
              },
          }

          Path("channels/beta.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "GovPro AI Release Bot"
          git config user.email "release-bot@govpro.invalid"
          git add channels/beta.json
          git commit -m "release: publish beta channel v$GOVPRO_VERSION"
          git push


  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            bundles: nsis,msi
            target: ""
          - name: macos-arm64
            runner: macos-15
            bundles: dmg
            target: aarch64-apple-darwin
          - name: macos-x64
            runner: macos-15-intel
            bundles: dmg
            target: x86_64-apple-darwin
          - name: linux-x64
            runner: ubuntu-24.04
            bundles: appimage,deb
            target: ""

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v7

      - name: Checkout engineering source
        uses: actions/checkout@v7
        with:
          repository: waslnison22-sudo/Hellsaiz-Gov-AI
          ref: ${{ needs.preflight.outputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source

      - name: Verify source commit
        working-directory: source
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"

      - name: Record source commit for artifact bundle
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        run: printf '%s\n' "$SOURCE_COMMIT" > SOURCE_COMMIT.txt

      - name: Install Linux dependencies
        if: startsWith(matrix.name, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             build-essential             curl             wget             file             libxdo-dev             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev             patchelf             xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: source/apps/desktop/src-tauri -> source/apps/desktop/src-tauri/target

      - name: Install desktop dependencies
        working-directory: source/apps/desktop
        run: npm install --no-audit --no-fund

      - name: Set application version
        working-directory: source
        shell: bash
        env:
          GOVPRO_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["GOVPRO_VERSION"]
          for path in (
              Path("apps/desktop/package.json"),
              Path("apps/desktop/src-tauri/tauri.conf.json"),
          ):
              data = json.loads(path.read_text(encoding="utf-8"))
              data["version"] = version
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          cargo = Path("apps/desktop/src-tauri/Cargo.toml")
          lines = cargo.read_text(encoding="utf-8").splitlines()
          for index, line in enumerate(lines):
              if line.startswith("version = "):
                  lines[index] = f'version = "{version}"'
                  break
          cargo.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Generate application icons
        working-directory: source/apps/desktop
        run: npm run tauri icon src-tauri/app-icon.svg

      - name: Build desktop bundles
        working-directory: source/apps/desktop
        shell: bash
        env:
          VITE_APP_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npm run tauri build -- --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
          else
            npm run tauri build -- --bundles "${{ matrix.bundles }}"
          fi

      - name: Collect installers
        working-directory: source
        shell: bash
        run: |
          rm -rf ../beta-assets
          mkdir -p ../beta-assets
          find apps/desktop/src-tauri/target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} ../beta-assets/ \;
          test -n "$(find ../beta-assets -type f -print -quit)"

          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path("../beta-assets")
          rows = []
          for path in sorted(root.iterdir()):
              if path.is_file():
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  rows.append(f"{digest}  {path.name}")
          Path("../beta-assets/SHA256SUMS.txt").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY

      - name: Upload Beta artifact
        uses: actions/upload-artifact@v7
        with:
          name: govpro-ai-beta-${{ needs.preflight.outputs.version }}-${{ matrix.name }}
          path: |
            beta-assets/*
            SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 14
