name: GovPro AI Beta Build

on:
  push:
    paths:
      - "release-request.json"
  workflow_dispatch:
    inputs:
      version:
        description: "Beta version, например 0.1.0-beta.1"
        required: true
        type: string
        default: "0.1.0-beta.1"
      source_ref:
        description: "Engineering repository ref"
        required: true
        type: string
        default: "main"

permissions:
  contents: read

concurrency:
  group: govpro-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Beta preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ.get("INPUT_VERSION", "").strip()
          source_ref = os.environ.get("INPUT_SOURCE_REF", "").strip()

          request = Path("release-request.json")
          if request.exists():
              data = json.loads(request.read_text(encoding="utf-8"))
              version = str(data.get("version", version)).strip()
              source_ref = str(data.get("source_ref", source_ref)).strip()

          if not re.fullmatch(r"\d+\.\d+\.\d+-[0-9A-Za-z.-]+", version):
              raise SystemExit("Beta version must be prerelease SemVer, for example 0.1.0-beta.1")
          if not source_ref:
              raise SystemExit("source_ref is required")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"source_ref={source_ref}\n")
          PY

      - name: Validate source credential
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SOURCE_REPO_TOKEN" ]; then
            echo "::error::SOURCE_REPO_TOKEN is not configured."
            exit 1
          fi

      - name: Checkout engineering source
        uses: actions/checkout@v4
        with:
          repository: waslnison22-sudo/Hellsaiz-Gov-AI
          ref: ${{ steps.meta.outputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source

      - name: Record source commit
        id: source
        working-directory: source
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          printf '%s\n' "$sha" > ../SOURCE_COMMIT.txt
          echo "source_commit=$sha" >> "$GITHUB_OUTPUT"

      - name: Validate release notes
        shell: bash
        env:
          GOVPRO_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          test -f "release-notes/v${GOVPRO_VERSION}.md"
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("release-notes") / f"v{os.environ['GOVPRO_VERSION']}.md"
          text = path.read_text(encoding="utf-8")
          for heading in ("## Новое", "## Улучшено", "## Исправлено", "## Безопасность", "## Установка"):
              if heading not in text:
                  raise SystemExit(f"Missing heading: {heading}")
          PY

  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            bundles: nsis,msi
            target: ""
          - name: macos-arm64
            runner: macos-15
            bundles: dmg
            target: aarch64-apple-darwin
          - name: macos-x64
            runner: macos-15-intel
            bundles: dmg
            target: x86_64-apple-darwin
          - name: linux-x64
            runner: ubuntu-24.04
            bundles: appimage,deb
            target: ""

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Checkout engineering source
        uses: actions/checkout@v4
        with:
          repository: waslnison22-sudo/Hellsaiz-Gov-AI
          ref: ${{ needs.preflight.outputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source

      - name: Verify source commit
        working-directory: source
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"

      - name: Install Linux dependencies
        if: startsWith(matrix.name, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             build-essential             curl             wget             file             libxdo-dev             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev             patchelf             xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: source/apps/desktop/src-tauri -> source/apps/desktop/src-tauri/target

      - name: Install desktop dependencies
        working-directory: source/apps/desktop
        run: npm ci --no-audit --no-fund

      - name: Set application version
        working-directory: source
        shell: bash
        env:
          GOVPRO_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["GOVPRO_VERSION"]
          for path in (
              Path("apps/desktop/package.json"),
              Path("apps/desktop/src-tauri/tauri.conf.json"),
          ):
              data = json.loads(path.read_text(encoding="utf-8"))
              data["version"] = version
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          cargo = Path("apps/desktop/src-tauri/Cargo.toml")
          lines = cargo.read_text(encoding="utf-8").splitlines()
          for index, line in enumerate(lines):
              if line.startswith("version = "):
                  lines[index] = f'version = "{version}"'
                  break
          cargo.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Generate application icons
        working-directory: source/apps/desktop
        run: npm run tauri icon src-tauri/app-icon.svg

      - name: Build desktop bundles
        working-directory: source/apps/desktop
        shell: bash
        env:
          VITE_APP_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npm run tauri build -- --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
          else
            npm run tauri build -- --bundles "${{ matrix.bundles }}"
          fi

      - name: Collect installers
        working-directory: source
        shell: bash
        run: |
          rm -rf ../beta-assets
          mkdir -p ../beta-assets
          find apps/desktop/src-tauri/target/release/bundle -type f             \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \)             -exec cp {} ../beta-assets/ \;
          test -n "$(find ../beta-assets -type f -print -quit)"

          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path("../beta-assets")
          rows = []
          for path in sorted(root.iterdir()):
              if path.is_file():
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  rows.append(f"{digest}  {path.name}")
          Path("../beta-assets/SHA256SUMS.txt").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY

      - name: Upload Beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: govpro-ai-beta-${{ needs.preflight.outputs.version }}-${{ matrix.name }}
          path: |
            beta-assets/*
            SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 14
